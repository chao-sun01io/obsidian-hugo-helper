[project]
name = "obsidian-hugo-helper"
version = "0.1.0"
description = "Convert flagged Obsidian vault notes into Hugo content."
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
]

[project.scripts]
obsidian-hugo-helper = "obsidian_hugo_helper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_hugo_helper"]
